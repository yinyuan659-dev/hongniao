# AI 红娘统一入口（https://gphnai.com）：Web 端 /  API /api  WS /ws  资源 /res
# 安全：按 IP 限流限连（防 CC / DoS），敏感接口更严，隐藏版本号，收紧超时

# 限流区（conf.d 会被 include 进 http 上下文）
limit_req_zone $binary_remote_addr zone=hn_api:10m   rate=20r/s;   # 常规 API
limit_req_zone $binary_remote_addr zone=hn_auth:10m  rate=10r/m;   # 注册 / 登录 / 管理员登录
limit_req_zone $binary_remote_addr zone=hn_up:10m    rate=30r/m;   # 上传
limit_req_zone $binary_remote_addr zone=hn_res:10m   rate=40r/s;   # 媒体资源
limit_conn_zone $binary_remote_addr zone=hn_conn:10m;

# HTTPS 证书：Let's Encrypt，宿主机上的 certbot 申请和续期（/etc/letsencrypt 只读挂进容器），续期后自动 nginx -s reload。
# 主地址是 https://gphnai.com；www、直接用 IP、http 一律跳到主地址。
ssl_certificate     /etc/letsencrypt/live/gphnai.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/gphnai.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:hn_ssl:10m;
ssl_session_timeout 1d;

# 80：只留证书续期的校验文件，其余全部跳到 https://gphnai.com
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # certbot --webroot 的校验文件（宿主机 /opt/hongniang/www/acme）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hongniang/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://gphnai.com$request_uri;
    }
}

# 443 上别的主机名（www.gphnai.com、直接用 IP）：跳到主地址
server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    return 301 https://gphnai.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gphnai.com;
    server_tokens off;

    # 全局默认只允许小包体；仅上传接口单独放大
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # 每 IP 并发连接上限（WS 长连接 + 页面资源足够用）
    limit_conn hn_conn 50;
    limit_conn_status 429;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 入口 index.html 一律不缓存：WebView / 浏览器缓存旧 index.html 会引用已被新部署删掉的旧 hash 资源 → 黑屏。
    # 带 hash 的 js / css 由文件名变化保证更新，可长缓存。
    location = /index.html {
        root /var/www/hongniang/web;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location ~ ^/assets/.+\.(js|css|woff2?|ttf|png|jpe?g|webp|svg)$ {
        root /var/www/hongniang/web;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 测试安装包下载（/opt/hongniang/www/app/）：文件不存在直接 404，否则会回落到 index.html，下载到的是网页
    location /app/ {
        root /var/www/hongniang;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store";
    }

    # Web 用户端
    location / {
        root /var/www/hongniang/web;
        try_files $uri $uri/ /index.html;
    }

    # 注册 / 登录：严格限频，防批量注册与撞库
    location /api/auth/ {
        limit_req zone=hn_auth burst=5 nodelay;
        proxy_pass http://hn-api:20800/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理员登录：最严
    location = /api/admin/login {
        limit_req zone=hn_auth burst=3 nodelay;
        proxy_pass http://hn-api:20800/api/admin/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传：放大包体、限频，防磁盘灌满
    location /api/upload/ {
        limit_req zone=hn_up burst=10 nodelay;
        client_max_body_size 210m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_pass http://hn-api:20800/api/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其余后端 API
    location /api/ {
        limit_req zone=hn_api burst=40 nodelay;
        proxy_pass http://hn-api:20800/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 通话信令（WHIP 推流 / WHEP 拉流）：App 发 SDP 过来，转给 SRS，SRS 回 SDP。只开这两个路径，SRS 自带的管理接口（/api/v1/…）不对外。
    # 音视频本身不走这里，走 SRS 的 UDP 8000。
    location ~ ^/rtc/v1/(whip|whep)/$ {
        limit_req zone=hn_api burst=40 nodelay;
        client_max_body_size 64k;
        proxy_pass http://hn-srs:1985;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws {
        proxy_pass http://hn-api:20800/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MinIO 对象资源（图片 / 视频）：只读，文件名为 UUID 不会变更，客户端可长期缓存
    location /res/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=hn_res burst=80 nodelay;
        proxy_pass http://hn-minio:9000/;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
